version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node major in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
